[package]
name = "loop-desktop"
version = "0.1.0"
description = "Loop desktop app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: system-tray support so closing the window hides to tray instead of quitting.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-fs = "2"
# Single-instance guard: a second launch focuses the running window instead of
# starting a duplicate process. Must be the first plugin registered.
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# WebDAV sync runs HTTP from the Rust side so it bypasses the WebView's CORS
# enforcement (browser fetch fails WebDAV PROPFIND with "Failed to fetch").
tauri-plugin-http = "2"
# Launch-on-boot: registers an OS-native autostart entry (Windows Run key /
# macOS LaunchAgent / Linux .desktop). Toggled from the "通用" settings page.
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"
# OS keychain access for credentials (PRD §5.4, §8.2). Bridges to:
#   macOS  → Keychain   · Windows → Credential Manager   · Linux → libsecret
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
