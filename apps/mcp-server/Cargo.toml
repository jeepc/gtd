[package]
name = "gtd-mcp-server"
version = "0.1.0"
edition = "2021"
description = "MCP server exposing the GTD vault to AI clients."

[[bin]]
name = "gtd-mcp-server"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
anyhow = "1"
directories = "5"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
strip = true
