<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 96" role="img" aria-label="Loop">
  <title>Loop</title>
  <desc>Loop — AI native GTD app logo, primary lockup</desc>

  <!-- Icon: an open loop with an orange dot at the opening.
       Geometry: stroke ring of radius 28, stroke-width 10, gap from angle -90° to angle 180° (i.e. top to left).
       Dot sits at the start of the stroke (top, 12 o'clock). -->
  <g transform="translate(48 48)">
    <path d="M 0 -28 A 28 28 0 1 1 -28 0"
          fill="none"
          stroke="#1A1A1A"
          stroke-width="10"
          stroke-linecap="round"/>
    <circle cx="0" cy="-28" r="7" fill="#FF5C39"/>
  </g>

  <!-- Wordmark: "Loop"
       Sized so cap-height ≈ icon diameter. Tight tracking, weight 500. -->
  <text x="104" y="62"
        font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="52"
        font-weight="500"
        letter-spacing="-1.5"
        fill="#1A1A1A">Loop</text>
</svg>
